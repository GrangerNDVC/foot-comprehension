<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Galerie des écrans d'histoire</title>

<h3>Écrans d'histoire (chantier 8) : toutes les scènes</h3><div class="g" id="g"></div>

<script src="../data/grosplan-reglages.js"></script><script src="../data/histoire-reglages.js"></script><script src="../js/histoire.js"></script>
<script>
JEU.assets.base = "../";
var liste = [["accueil","avant"],["prologue","avant"],["m1","avant"],["m1","apres"],["m2","avant"],["m2","apres"],["m3","avant"],["m3","apres"],["m4","avant"],["m4","apres"],["m5","avant"],["m5","apres"],["m6","avant"],["m6","apres"],["fin","apres"]];
var g = document.getElementById("g"), cvs = [];
JEU.assets.charger(JEU.histoireReglages.images);
liste.forEach(function (x) {
  var d = document.createElement("div"); d.className = "c"; d.textContent = x[0] + " / " + x[1];
  var c = document.createElement("canvas"); c.width = 512; c.height = 448; d.appendChild(c); g.appendChild(d); cvs.push([c, x]);
});
// attendre les images puis tout dessiner (plusieurs fois : les atlas se décodent à la demande)
var n = 0; (function boucle() {
  cvs.forEach(function (o) { JEU.histoire.preparer(o[1][0], function () { JEU.histoire.dessiner(o[0], o[1][0], o[1][1], 300); }); });
  if (n++ < 8) { setTimeout(boucle, 250); } else { document.title = "pret"; }
})();
</script></body></html>
