<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Galerie des gros plans (test)</title>
<style>body{background:#222;color:#fff;font:12px Verdana,sans-serif;margin:6px}
.c{display:inline-block;margin:3px;vertical-align:top}canvas{display:block;border:1px solid #555;width:316px;height:197px;image-rendering:pixelated}
h3{margin:8px 0 2px;font-size:13px}</style></head><body>
<h2 id="titre">Galerie des gros plans</h2><div id="sortie"></div>
<!-- mêmes fichiers que index.html (chemins relatifs à outils-test/) -->
<script src="../data/config.js"></script><script src="../data/championnat.js"></script>
<script src="../assets/atlas/joueur-01-atlas.js"></script><script src="../assets/atlas/joueur-02-atlas.js"></script><script src="../assets/atlas/joueur-03-atlas.js"></script>
<script src="../assets/atlas/joueur-04-atlas.js"></script><script src="../assets/atlas/joueur-05-atlas.js"></script><script src="../assets/atlas/joueur-06-atlas.js"></script>
<script src="../assets/atlas/joueur-07-atlas.js"></script><script src="../assets/atlas/joueur-08-atlas.js"></script><script src="../assets/atlas/joueur-09-atlas.js"></script>
<script src="../assets/atlas/joueur-10-atlas.js"></script><script src="../assets/atlas/joueur-11-atlas.js"></script><script src="../assets/atlas/joueur-12-atlas.js"></script>
<script src="../assets/atlas/gardiens-atlas.js"></script><script src="../js/sprites-recolor.js"></script>
<script src="../data/equipes/equipe-nankatsu.js"></script><script src="../data/equipes/equipe-azumaichi.js"></script><script src="../data/equipes/equipe-nishikigaoka.js"></script>
<script src="../data/equipes/equipe-hanawa.js"></script><script src="../data/equipes/equipe-hirado.js"></script><script src="../data/equipes/equipe-furano.js"></script><script src="../data/equipes/equipe-toho.js"></script>
<script src="../assets/manifest.js"></script><script src="../js/assets.js"></script><script src="../data/grosplan-reglages.js"></script><script src="../js/grosplan.js"></script>
<script>
/* Paramètres dans l'adresse : ?types=tir,passe&ps=0.2,0.4,0.6,0.8,1&niveaux=1,3&issues=ok,ko&match=m6&porteur=10&adv=9&cible=8 */
var q = {}; location.search.replace(/^\?/, "").split("&").forEach(function (kv) { var a = kv.split("="); if (a[0]) { q[a[0]] = decodeURIComponent(a[1] || ""); } });
function liste(k, d) { return (q[k] || d).split(","); }
var types = liste("types", "passe,dribble,tir,couper,tacler,bloquer,degager,gardien");
var ps = liste("ps", "0.2,0.4,0.6,0.8,1").map(Number);
var niveaux = liste("niveaux", "1").map(Number);
var issues = liste("issues", "ok,ko");
var match = q.match || "m6", porteur = Number(q.porteur || 10), adv = Number(q.adv || 9), cible = Number(q.cible || 8);
var out = document.getElementById("sortie"), log = [];
J = JEU; JEU.assets.base = "../";
JEU.grosplan.preparer({ id: match }, function (ok) { setTimeout(dessinerTout, 900); });
function dessinerTout() {
  types.forEach(function (t) {
    niveaux.forEach(function (n) {
      issues.forEach(function (iss) {
        var h = document.createElement("h3"); h.textContent = t + " — niveau " + n + " — " + iss; out.appendChild(h);
        ps.forEach(function (p) {
          var d = document.createElement("div"); d.className = "c";
          var cv = document.createElement("canvas"); cv.width = 480; cv.height = 300; d.appendChild(cv); out.appendChild(d);
          var spec = { type: t, ok: iss === "ok", but: (t === "tir" && iss === "ok") ? "nous" : (t === "gardien" && iss === "ko" ? "eux" : null), niveau: n, matchId: match, porteur: porteur, adv: adv, cible: cible };
          var mode = JEU.grosplan.image(cv, spec, p);
          if (mode !== "sprites") { log.push(t + " " + iss + " " + n + " : formes"); }
        });
      });
    });
  });
  document.getElementById("titre").setAttribute("data-fini", "1");
  document.title = "fini " + log.length;
  window.__log = log;
}
</script></body></html>
